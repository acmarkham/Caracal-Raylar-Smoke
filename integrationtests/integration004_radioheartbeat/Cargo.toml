[package]
name = "integration-test-004-radio-heartbeat"
version = "0.1.0"
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "integration004_radioheartbeat"
path = "lib.rs"

[[bin]]
name = "integration-test-004-radio-heartbeat"
path = "main.rs"
test = false
bench = false

[dependencies]
embassy-time.workspace = true
heapless = "0.8.0"
raylar-radio-service = { path = "../../crates/services/radio" }
raylar-time-service = { path = "../../crates/services/time", default-features = false }

[target.'cfg(target_arch = "arm")'.dependencies]
raylar-board-v1p0 = { path = "../../crates/board/raylar_v1p0" }
raylar-drivers = { path = "../../crates/drivers", features = ["stm32", "defmt"] }
raylar-storage-service = { path = "../../crates/services/storage", features = ["defmt"] }
raylar-time-service = { path = "../../crates/services/time", features = ["gps", "defmt"] }
raylar-logging-service = { path = "../../crates/services/logging", features = ["defmt"] }
raylar-location-service = { path = "../../crates/services/location", features = ["defmt"] }
raylar-radio-service = { path = "../../crates/services/radio", features = ["defmt"] }
embassy-stm32.workspace = true
embassy-executor.workspace = true
embassy-sync = "0.7.2"
embassy-futures = "0.1.2"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-alloc = { version = "0.7.0", default-features = false, features = ["llff"] }
defmt.workspace = true
defmt-rtt.workspace = true
panic-probe.workspace = true
cortex-m.workspace = true
cortex-m-rt.workspace = true
static_cell.workspace = true

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
defmt = { workspace = true, features = ["unstable-test"] }
embassy-time = { workspace = true, features = ["std", "generic-queue-8"] }

[features]
default = ["lora", "channel-868"]
lora = []
gfsk = []
channel-868 = []
channel-915 = []
channel-2445 = []
trustzone-secure = [
    "embassy-stm32/trustzone-secure",
    "raylar-drivers/trustzone-secure",
]

[package.metadata.embassy]
build = [{ target = "thumbv8m.main-none-eabihf", artifact-dir = "out/integrationtests/integration004_radioheartbeat" }]
