[package]
name = "integration-test-002-monoaudiolog"
version = "0.1.0"
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "integration-test-002-monoaudiolog"
path = "main.rs"
test = false
bench = false

[dependencies]
raylar-audio-recorder-service = { path = "../../crates/services/audiorecorder", features = ["defmt"] }
raylar-audiosource = { path = "../../crates/metadrivers/audiosource", features = ["defmt"] }
raylar-board-v1p0 = { path = "../../crates/board/raylar_v1p0" }
raylar-drivers = { path = "../../crates/drivers", features = ["stm32", "defmt"] }
raylar-storage-service = { path = "../../crates/services/storage", features = ["defmt"] }
raylar-time-service = { path = "../../crates/services/time", features = ["gps", "defmt"] }
raylar-logging-service = { path = "../../crates/services/logging", features = ["defmt"] }
raylar-location-service = { path = "../../crates/services/location", features = ["defmt"] }
raylar-power-management-service = { path = "../../crates/services/powermanagement", features = ["defmt"] }
raylar-versioning-service = { path = "../../crates/services/versioning", features = ["stm32", "defmt"] }
embassy-stm32.workspace = true
embassy-executor = { workspace = true, features = ["trace"] }
embassy-time.workspace = true
embassy-sync = "0.7.2"
embedded-alloc = { version = "0.7.0", default-features = false, features = ["llff"] }
defmt.workspace = true
defmt-rtt.workspace = true
panic-probe.workspace = true
cortex-m.workspace = true
cortex-m-rt.workspace = true
static_cell.workspace = true

[features]
trustzone-secure = [
    "embassy-stm32/trustzone-secure",
    "raylar-drivers/trustzone-secure",
    "raylar-versioning-service/trustzone-secure",
]
# Indoor development only: inject a synthetic Laboratory time anchor and leave
# the GPS hardware disabled. Production/default builds always require GPS time.
fake-gps-time = []

[package.metadata.embassy]
build = [{ target = "thumbv8m.main-none-eabihf", artifact-dir = "out/integrationtests/integration002_monoaudiolog" }]
