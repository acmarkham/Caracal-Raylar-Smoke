[package]
name = "raylar-versioning-service"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "raylar_versioning_service"
path = "src/lib.rs"

[features]
default = []
defmt = ["dep:defmt", "embassy-sync/defmt", "raylar-drivers/defmt"]
stm32 = ["raylar-drivers/stm32"]
trustzone-secure = ["stm32", "raylar-drivers/trustzone-secure"]

[dependencies]
defmt = { workspace = true, optional = true }
embassy-sync = "0.7.2"
embassy-time.workspace = true
heapless = "0.8.0"
raylar-drivers = { path = "../../drivers" }
