[package]
name = "unit-smoke-l4-01-helloworld"
version = "0.1.0"
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "unit-smoke-l4-01-helloworld"
path = "main.rs"
test = false
bench = false

[dependencies]
# Deliberately do not inherit the workspace HAL: it still selects STM32U595.
# One leaf package is built per invocation, so Cargo does not unify both chips.
embassy-stm32 = { version = "0.6.0", features = ["defmt", "memory-x", "stm32l476rg", "time-driver-tim5", "unstable-pac"] }
embassy-executor.workspace = true
embassy-time.workspace = true
defmt.workspace = true
defmt-rtt.workspace = true
panic-probe.workspace = true
cortex-m.workspace = true
cortex-m-rt.workspace = true

[package.metadata.embassy]
build = [
    { target = "thumbv7em-none-eabihf", artifact-dir = "out/unitsmokeL4/01_helloworld" },
]
