[package]
name = "unit-smoke-l4-03-gps"
version = "0.1.0"
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
path = "lib.rs"

[[bin]]
name = "unit-smoke-l4-03-gps"
path = "main.rs"
required-features = ["firmware"]
test = false
bench = false

[features]
default = ["firmware"]
firmware = ["dep:embassy-stm32", "dep:embassy-executor", "dep:embassy-time", "dep:defmt", "dep:defmt-rtt", "dep:panic-probe", "dep:cortex-m", "dep:cortex-m-rt", "dep:embedded-io-async", "dep:raylar-drivers", "dep:critical-section"]

[dependencies]
# Select the L4 HAL only in this leaf, in a separate Cargo invocation from U5.
embassy-stm32 = { version = "0.6.0", features = ["defmt", "exti", "memory-x", "stm32l476rg", "time-driver-tim5", "unstable-pac"], optional = true }
embassy-executor = { workspace = true, optional = true }
embassy-time = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }
defmt-rtt = { workspace = true, optional = true }
panic-probe = { workspace = true, optional = true }
cortex-m = { workspace = true, optional = true }
cortex-m-rt = { workspace = true, optional = true }
embedded-io-async = { version = "0.7.0", optional = true }
critical-section = { version = "1.2.0", optional = true }
raylar-drivers = { path = "../../crates/drivers", default-features = false, features = ["defmt"], optional = true }

[package.metadata.embassy]
build = [
    { target = "thumbv7em-none-eabihf", artifact-dir = "out/unitsmokeL4/03_gps" },
]
