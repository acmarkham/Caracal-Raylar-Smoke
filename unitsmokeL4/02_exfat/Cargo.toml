[package]
name = "unit-smoke-l4-02-exfat"
version = "0.1.0"
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "unit-smoke-l4-02-exfat"
path = "main.rs"
test = false
bench = false

[features]
default = []
write-test = []

[dependencies]
# Select L4 at this leaf; the inherited workspace HAL still selects U5.
embassy-stm32 = { version = "0.6.0", features = ["defmt", "memory-x", "stm32l476rg", "time-driver-tim5", "unstable-pac"] }
embassy-executor.workspace = true
embassy-time.workspace = true
defmt.workspace = true
defmt-rtt.workspace = true
panic-probe.workspace = true
cortex-m.workspace = true
cortex-m-rt.workspace = true
static_cell.workspace = true
# Reuse upstream portable partition/filesystem/storage code, without its U5 backend.
raylar-drivers = { path = "../../crates/drivers", default-features = false, features = ["defmt"] }
exfat-slim = { version = "0.5.0", default-features = false, features = ["defmt"] }
aligned = "0.4.2"
heapless = "0.8.0"
embedded-alloc = { version = "0.7.0", default-features = false, features = ["llff"] }

[package.metadata.embassy]
build = [{ target = "thumbv7em-none-eabihf", artifact-dir = "out/unitsmokeL4/02_exfat" }]
