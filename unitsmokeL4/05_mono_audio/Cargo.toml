[package]
name = "unit-smoke-l4-05-mono-audio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
path = "lib.rs"

[[bin]]
name = "unit-smoke-l4-05-mono-audio"
path = "main.rs"
required-features = ["firmware"]
test = false
bench = false

[features]
default = ["firmware"]
firmware = ["dep:embassy-stm32", "dep:embassy-executor", "dep:embassy-time", "dep:defmt", "dep:defmt-rtt", "dep:panic-probe", "dep:cortex-m", "dep:cortex-m-rt", "dep:raylar-audiosource"]

[dependencies]
# Build this leaf separately from U5; do not inherit its HAL chip selection.
embassy-stm32 = { version = "0.6.0", features = ["defmt", "memory-x", "stm32l476rg", "time-driver-tim5", "unstable-pac"], optional = true }
embassy-executor = { workspace = true, optional = true }
embassy-time = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }
defmt-rtt = { workspace = true, optional = true }
panic-probe = { workspace = true, optional = true }
cortex-m = { workspace = true, optional = true }
cortex-m-rt = { workspace = true, optional = true }
raylar-audiosource = { path = "../../crates/metadrivers/audiosource", features = ["defmt"], optional = true }

[package.metadata.embassy]
build = [{ target = "thumbv7em-none-eabihf", artifact-dir = "out/unitsmokeL4/05_mono_audio" }]
