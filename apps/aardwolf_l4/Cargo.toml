[package]
name = "aardwolf-l4"
version = "0.1.0"
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
path = "lib.rs"

[[bin]]
name = "aardwolf-l4"
path = "main.rs"
required-features = ["firmware"]
test = false
bench = false

[features]
default = ["firmware"]
firmware = ["caracal-evo/firmware", "dep:embassy-stm32", "dep:embassy-executor", "dep:embassy-sync", "dep:embassy-futures", "dep:defmt", "dep:defmt-rtt", "dep:cortex-m", "dep:cortex-m-rt", "dep:static_cell", "dep:embedded-alloc", "dep:exfat-slim", "dep:embedded-io-async", "dep:raylar-audiosource", "dep:raylar-audio-recorder-service", "dep:raylar-storage-service", "dep:raylar-logging-service", "dep:raylar-location-service"]
# Only the off interval is shortened to 30 s. Estimator and tracking policy match U5.
bench-gps-cycle = []
bench-audio-ui = []

[dependencies]
aligned = "0.4.2"
caracal-evo = { path = "../../crates/board/caracal_evo" }
embassy-stm32 = { version = "0.6.0", features = ["defmt", "memory-x", "stm32l476rg", "time-driver-tim5", "unstable-pac"], optional = true }
embassy-executor = { workspace = true, features = ["trace"], optional = true }
embassy-time.workspace = true
embassy-sync = { version = "0.7.2", optional = true }
embassy-futures = { version = "0.1.2", optional = true }
defmt = { workspace = true, optional = true }
defmt-rtt = { workspace = true, features = ["disable-blocking-mode"], optional = true }
cortex-m = { workspace = true, optional = true }
cortex-m-rt = { workspace = true, optional = true }
static_cell = { workspace = true, optional = true }
embedded-alloc = { version = "0.7.0", default-features = false, features = ["llff"], optional = true }
heapless = "0.8.0"
exfat-slim = { version = "0.5.0", default-features = false, features = ["defmt", "small-write-batches"], optional = true }
embedded-io-async = { version = "0.7.0", optional = true }
raylar-drivers = { path = "../../crates/drivers", default-features = false, features = ["ublox-m10", "pps-chained-capture"] }
raylar-time-service = { path = "../../crates/services/time", default-features = false, features = ["gps"] }
raylar-audiosource = { path = "../../crates/metadrivers/audiosource", features = ["defmt"], optional = true }
raylar-audio-recorder-service = { path = "../../crates/services/audiorecorder", features = ["defmt"], optional = true }
raylar-storage-service = { path = "../../crates/services/storage", features = ["defmt"], optional = true }
raylar-logging-service = { path = "../../crates/services/logging", features = ["defmt"], optional = true }
raylar-location-service = { path = "../../crates/services/location", features = ["defmt"], optional = true }

[dev-dependencies]
defmt = { workspace = true, features = ["unstable-test"] }
critical-section = { version = "1.2.0", features = ["std"] }
embassy-time = { workspace = true, features = ["std", "generic-queue-8"] }

[package.metadata.embassy]
build = [{ target = "thumbv7em-none-eabihf", artifact-dir = "out/apps/aardwolf_l4" }]
