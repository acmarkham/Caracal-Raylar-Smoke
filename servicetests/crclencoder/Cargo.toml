[package]
name = "service-test-crclencoder"
default-run = "service-test-crclencoder"
version = "0.1.0"
edition.workspace = true
license.workspace = true
build = "../audiorecorder/build.rs"

[[bin]]
name = "service-test-crclencoder"
path = "main.rs"
test = false
bench = false

[[bin]]
name = "crcl-loop-benchmark"
path = "loop_benchmark.rs"
required-features = ["loop-benchmark"]
test = false
bench = false

[[bin]]
name = "sd-lifecycle-stress"
path = "sd_lifecycle_stress.rs"
test = false
bench = false

[dependencies]
aligned = "0.4.2"
raylar-stage-profiling = { path = "../../crates/profiling" }
raylar-audio-recorder-service = { path = "../../crates/services/audiorecorder", features = ["defmt"] }
raylar-audiosource = { path = "../../crates/metadrivers/audiosource", features = ["defmt"] }
raylar-crcl-encoder-service = { path = "../../crates/services/crclencoder", features = ["defmt"] }
raylar-board-v1p0 = { path = "../../crates/board/raylar_v1p0" }
raylar-drivers = { path = "../../crates/drivers", features = ["stm32", "defmt"] }
raylar-storage-service = { path = "../../crates/services/storage", features = ["defmt"] }
raylar-time-service = { path = "../../crates/services/time", features = ["gps", "defmt"] }
embassy-stm32.workspace = true
embassy-executor.workspace = true
embassy-time.workspace = true
embassy-sync = "0.7.2"
embassy-futures = "0.1.2"
embedded-alloc = { version = "0.7.0", default-features = false, features = ["llff"] }
static_cell.workspace = true
defmt.workspace = true
defmt-rtt.workspace = true
panic-probe.workspace = true
cortex-m.workspace = true
cortex-m-rt.workspace = true

[features]
noise-floor = []
sd-recording = []
laboratory-time = ["sd-recording"]
recovery-test = ["laboratory-time", "cheap-crcl"]
stage-profiling = ["laboratory-time", "raylar-stage-profiling/detail"]
profile-control = ["laboratory-time", "raylar-stage-profiling/dwt"]
cheap-crcl = []
loop-benchmark = ["raylar-crcl-encoder-service/loop-benchmark"]
deep-sd-diagnostics = ["raylar-drivers/storage-diagnostics"]
trustzone-secure = ["embassy-stm32/trustzone-secure", "raylar-drivers/trustzone-secure"]
